<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- A star inside a tilted orbit, with an asteroid on the front of the orbit -->
  <ellipse cx="32" cy="32" rx="29" ry="10" fill="none" stroke="#8fb4ff" stroke-width="3" transform="rotate(-20 32 32)"/>
  <polygon points="32,10 38.5,23.5 53,24.5 42,34 45.5,48.5 32,40.5 18.5,48.5 22,34 11,24.5 25.5,23.5" fill="#ffc83d" stroke="#e08a10" stroke-width="2" stroke-linejoin="round"/>
  <!-- The front half of the orbit, drawn over the star -->
  <path d="M 3 32 A 29 10 0 0 0 61 32" fill="none" stroke="#8fb4ff" stroke-width="3" transform="rotate(-20 32 32)"/>
  <circle cx="52" cy="33" r="5" fill="#a08f7c" stroke="#3a2e26" stroke-width="2"/>
</svg>
